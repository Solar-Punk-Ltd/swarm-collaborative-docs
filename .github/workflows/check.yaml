name: Check

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Commit linting
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: ./commitlint.config.cjs

      - name: Code linting
        run: pnpm run lint
        env:
          CI: true

      - name: Dependency check
        run: pnpm run depcheck

      - name: Types check (library)
        run: pnpm run check:types

      - name: Types check (demo app)
        run: pnpm run check:types:app

      - name: Build demo app
        run: pnpm run build:app

      - name: Build library
        run: pnpm run build:lib

      - name: Verify peers are not bundled
        run: |
          set -euo pipefail
          esm=dist/SwarmCollaborativeDocs.mjs

          test -f "$esm" || { echo "::error::missing build output $esm"; exit 1; }

          if grep -q "_transactionCleanups" "$esm"; then
            echo "::error::yjs is inlined — check rollupOptions.external in vite.config.mts"
            exit 1
          fi

          for dep in "yjs" "@ethersphere/bee-js"; do
            grep -q "\"$dep\"" "$esm" || {
              echo "::error::$esm does not import \"$dep\" — it was inlined or dropped"
              exit 1
            }
          done

      - name: Validate package manifest
        run: pnpm dlx publint@latest
