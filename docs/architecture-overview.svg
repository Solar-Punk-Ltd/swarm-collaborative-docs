<svg width="100%" viewBox="0 0 680 820" role="img" xmlns="http://www.w3.org/2000/svg">
<title>swarm-collaborative-docs architecture overview</title>
<desc>Layered structural diagram showing React UI, SwarmDoc core, transport adapters, and Swarm/Bee infrastructure</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
    .th  { font-size: 14px; font-weight: 500; }
    .ts  { font-size: 12px; font-weight: 400; fill: #555; }
    .arr { stroke: #888; stroke-width: 1; fill: none; }

    /* layer fills */
    .layer-purple { fill: #EEEDFE; stroke: #7F77DD; }
    .inner-purple { fill: #D8D6F8; stroke: #7F77DD; }
    .layer-teal   { fill: #E1F5EE; stroke: #1D9E75; }
    .inner-teal   { fill: #C2ECD9; stroke: #1D9E75; }
    .layer-coral  { fill: #FAECE7; stroke: #D85A30; }
    .inner-coral  { fill: #F5C4B3; stroke: #D85A30; }
    .layer-gray   { fill: #F1EFE8; stroke: #888780; }
    .inner-gray   { fill: #E0DDD5; stroke: #888780; }
    .layer-blue   { fill: #E6F1FB; stroke: #378ADD; }
    .inner-blue   { fill: #C8DFF6; stroke: #378ADD; }

    .text-purple { fill: #3C3489; }
    .text-teal   { fill: #0F6E56; }
    .text-coral  { fill: #993C1D; }
    .text-gray   { fill: #444441; }
    .text-blue   { fill: #0C447C; }
    .text-sub    { fill: #5F5E5A; }
  </style>
</defs>

<!-- ── Layer 1: React UI ── -->
<rect x="30" y="20" width="620" height="114" rx="12" stroke-width="0.5" class="layer-purple"/>
<text class="th text-purple" x="50" y="44">React UI layer</text>

<rect x="50" y="54" width="175" height="60" rx="6" stroke-width="0.5" class="inner-purple"/>
<text class="th text-purple" x="138" y="76" text-anchor="middle">MonacoEditor</text>
<text class="ts text-sub"    x="138" y="94" text-anchor="middle">y-monaco binding</text>

<rect x="247" y="54" width="155" height="60" rx="6" stroke-width="0.5" class="inner-purple"/>
<text class="th text-purple" x="325" y="76" text-anchor="middle">DocEditor</text>
<text class="ts text-sub"    x="325" y="94" text-anchor="middle">textarea fallback</text>

<rect x="424" y="54" width="205" height="60" rx="6" stroke-width="0.5" class="inner-purple"/>
<text class="th text-purple" x="527" y="76" text-anchor="middle">useSwarmDoc hook</text>
<text class="ts text-sub"    x="527" y="94" text-anchor="middle">doc, awareness, updateCursor</text>

<line x1="340" y1="134" x2="340" y2="156" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<!-- ── Layer 2: SwarmDoc core ── -->
<rect x="30" y="160" width="620" height="150" rx="12" stroke-width="0.5" class="layer-teal"/>
<text class="th text-teal" x="50" y="184">SwarmDoc core  (doc.ts)</text>

<rect x="50"  y="194" width="170" height="56" rx="6" stroke-width="0.5" class="inner-teal"/>
<text class="th text-teal" x="135" y="216" text-anchor="middle">Y.Doc (Yjs)</text>
<text class="ts text-sub"  x="135" y="234" text-anchor="middle">CRDT, update events</text>

<rect x="244" y="194" width="170" height="56" rx="6" stroke-width="0.5" class="inner-teal"/>
<text class="th text-teal" x="329" y="216" text-anchor="middle">Snapshot store</text>
<text class="ts text-sub"  x="329" y="234" text-anchor="middle">writeDoc / readDoc</text>

<rect x="438" y="194" width="190" height="56" rx="6" stroke-width="0.5" class="inner-teal"/>
<text class="th text-teal" x="533" y="216" text-anchor="middle">Cursor broadcast</text>
<text class="ts text-sub"  x="533" y="234" text-anchor="middle">debounced CursorPayload</text>

<text class="ts text-sub" x="340" y="282" text-anchor="middle">NotificationPayload  (join | doc | cursor)  →  transport.publish()</text>
<text class="ts text-sub" x="340" y="298" text-anchor="middle">transport.subscribe()  →  handler routes by payload.type</text>

<line x1="340" y1="310" x2="340" y2="333" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<!-- ── Layer 3: Transport adapters ── -->
<rect x="30" y="336" width="620" height="120" rx="12" stroke-width="0.5" class="layer-coral"/>
<text class="th text-coral" x="50" y="360">Transport adapters  (DocTransport interface)</text>

<rect x="50"  y="370" width="130" height="66" rx="6" stroke-width="0.5" class="inner-coral"/>
<text class="th text-coral" x="115" y="390" text-anchor="middle">SwarmRtc</text>
<text class="ts text-sub"   x="115" y="408" text-anchor="middle">binary + JSON</text>
<text class="ts text-sub"   x="115" y="424" text-anchor="middle">over DataChannel</text>

<rect x="200" y="370" width="130" height="66" rx="6" stroke-width="0.5" class="inner-coral"/>
<text class="th text-coral" x="265" y="390" text-anchor="middle">SwarmPubSub</text>
<text class="ts text-sub"   x="265" y="408" text-anchor="middle">GSOC ephemeral</text>
<text class="ts text-sub"   x="265" y="424" text-anchor="middle">JSON over WS</text>

<rect x="350" y="370" width="130" height="66" rx="6" stroke-width="0.5" class="inner-coral"/>
<text class="th text-coral" x="415" y="390" text-anchor="middle">yWebrtc</text>
<text class="ts text-sub"   x="415" y="408" text-anchor="middle">y-webrtc library</text>
<text class="ts text-sub"   x="415" y="424" text-anchor="middle">awareness bridge</text>

<rect x="500" y="370" width="130" height="66" rx="6" stroke-width="0.5" class="inner-coral"/>
<text class="th text-coral" x="565" y="390" text-anchor="middle">Waku</text>
<text class="ts text-sub"   x="565" y="408" text-anchor="middle">LightPush / Filter</text>
<text class="ts text-sub"   x="565" y="424" text-anchor="middle">JSON over libp2p</text>

<!-- ── Layer 4: Infrastructure ── -->
<rect x="30" y="496" width="620" height="296" rx="12" stroke-width="0.5" class="layer-gray"/>
<text class="th text-gray" x="50" y="520">Infrastructure</text>

<!-- Bee node -->
<rect x="50"  y="530" width="190" height="242" rx="8" stroke-width="0.5" class="layer-blue"/>
<text class="th text-blue" x="145" y="554" text-anchor="middle">Bee node</text>
<text class="ts text-sub"  x="145" y="570" text-anchor="middle">local HTTP API</text>

<rect x="64" y="580" width="162" height="46" rx="5" stroke-width="0.5" class="inner-blue"/>
<text class="th text-blue" x="145" y="599" text-anchor="middle">Mutable feeds</text>
<text class="ts text-sub"  x="145" y="616" text-anchor="middle">doc snapshots per peer</text>

<rect x="64" y="636" width="162" height="46" rx="5" stroke-width="0.5" class="inner-blue"/>
<text class="th text-blue" x="145" y="655" text-anchor="middle">GSOC pubsub</text>
<text class="ts text-sub"  x="145" y="672" text-anchor="middle">ephemeral notifications</text>

<rect x="64" y="692" width="162" height="46" rx="5" stroke-width="0.5" class="inner-blue"/>
<text class="th text-blue" x="145" y="711" text-anchor="middle">Signal feeds</text>
<text class="ts text-sub"  x="145" y="728" text-anchor="middle">SDP offer / answer, polling</text>

<!-- SwarmSignal -->
<rect x="264" y="530" width="160" height="100" rx="8" stroke-width="0.5" class="inner-gray"/>
<text class="th text-gray" x="344" y="554" text-anchor="middle">SwarmSignal</text>
<text class="ts text-sub"  x="344" y="572" text-anchor="middle">writes SDP to peer feed</text>
<text class="ts text-sub"  x="344" y="590" text-anchor="middle">polling for answer</text>
<text class="ts text-sub"  x="344" y="608" text-anchor="middle">→ RTCPeerConnection</text>

<!-- WebRTC DataChannel -->
<rect x="264" y="646" width="160" height="62" rx="8" stroke-width="0.5" class="inner-gray"/>
<text class="th text-gray" x="344" y="668" text-anchor="middle">WebRTC DataChannel</text>
<text class="ts text-sub"  x="344" y="686" text-anchor="middle">P2P after handshake</text>

<!-- y-webrtc signaling -->
<rect x="448" y="530" width="178" height="80" rx="8" stroke-width="0.5" class="inner-gray"/>
<text class="th text-gray" x="537" y="554" text-anchor="middle">y-webrtc signaling</text>
<text class="ts text-sub"  x="537" y="572" text-anchor="middle">external WS server</text>
<text class="ts text-sub"  x="537" y="590" text-anchor="middle">Y.Awareness protocol</text>

<!-- Waku network -->
<rect x="448" y="626" width="178" height="80" rx="8" stroke-width="0.5" class="inner-gray"/>
<text class="th text-gray" x="537" y="650" text-anchor="middle">Waku network</text>
<text class="ts text-sub"  x="537" y="668" text-anchor="middle">libp2p bootstrap peers</text>
<text class="ts text-sub"  x="537" y="686" text-anchor="middle">LightPush + Filter</text>

<!-- ── Arrows: transports → waypoint → infra ── -->

<!-- SwarmRtc → SwarmSignal (routes up then right) -->
<path d="M115 456 L115 480 L344 480 L344 530" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- SwarmRtc → Mutable feeds (dashed, snapshot path) -->
<path d="M90 456 L90 470 L145 470 L145 580" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- SwarmSignal → Signal feeds (dashed, internal) -->
<path d="M264 580 L240 580 L240 715 L226 715" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- SwarmSignal → DataChannel -->
<line x1="344" y1="630" x2="344" y2="646" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<!-- SwarmPubSub → GSOC pubsub -->
<path d="M265 456 L265 470 L145 470 L145 636" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- yWebrtc → y-webrtc signaling -->
<path d="M415 456 L415 480 L537 480 L537 530" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Waku → Waku network -->
<path d="M565 456 L565 480 L626 480 L626 666 L626 666 L537 666" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ── Legend ── -->
<line x1="50" y1="806" x2="80" y2="806" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts text-sub" x="88" y="810">real-time data path</text>
<line x1="230" y1="806" x2="260" y2="806" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts text-sub" x="268" y="810">snapshot / persistence path</text>

</svg>
