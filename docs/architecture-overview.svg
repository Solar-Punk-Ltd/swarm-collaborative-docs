<svg width="100%" viewBox="0 0 680 800" role="img" xmlns="http://www.w3.org/2000/svg">
<title>swarm-collaborative-docs architecture overview</title>
<desc>Layered structural diagram showing the application layer, the SwarmDoc core, the two shipped transport adapters, and the Swarm/Bee infrastructure they use</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
    .th  { font-size: 14px; font-weight: 500; }
    .ts  { font-size: 12px; font-weight: 400; fill: #555; }

    /* layer fills */
    .layer-purple { fill: #EEEDFE; stroke: #7F77DD; }
    .inner-purple { fill: #D8D6F8; stroke: #7F77DD; }
    .layer-teal   { fill: #E1F5EE; stroke: #1D9E75; }
    .inner-teal   { fill: #C2ECD9; stroke: #1D9E75; }
    .layer-coral  { fill: #FAECE7; stroke: #D85A30; }
    .inner-coral  { fill: #F5C4B3; stroke: #D85A30; }
    .layer-gray   { fill: #F1EFE8; stroke: #888780; }
    .inner-gray   { fill: #E0DDD5; stroke: #888780; }
    .layer-blue   { fill: #E6F1FB; stroke: #378ADD; }
    .inner-blue   { fill: #C8DFF6; stroke: #378ADD; }

    .text-purple { fill: #3C3489; }
    .text-teal   { fill: #0F6E56; }
    .text-coral  { fill: #993C1D; }
    .text-gray   { fill: #444441; }
    .text-blue   { fill: #0C447C; }
    .text-sub    { fill: #5F5E5A; }
  </style>
</defs>

<!-- ── Layer 1: application ── -->
<rect x="30" y="20" width="620" height="110" rx="12" stroke-width="0.5" class="layer-purple"/>
<text class="th text-purple" x="50" y="44">Application layer</text>

<rect x="50" y="54" width="185" height="62" rx="6" stroke-width="0.5" class="inner-purple"/>
<text class="th text-purple" x="142" y="80" text-anchor="middle">Editor binding</text>
<text class="ts text-sub"    x="142" y="98" text-anchor="middle">y-monaco, doc-editor, …</text>

<rect x="245" y="54" width="180" height="62" rx="6" stroke-width="0.5" class="inner-purple"/>
<text class="th text-purple" x="335" y="80" text-anchor="middle">Invite handling</text>
<text class="ts text-sub"    x="335" y="98" text-anchor="middle">room key in the URL fragment</text>

<rect x="435" y="54" width="195" height="62" rx="6" stroke-width="0.5" class="inner-purple"/>
<text class="th text-purple" x="532" y="80" text-anchor="middle">DOC_EVENTS subscriber</text>
<text class="ts text-sub"    x="532" y="98" text-anchor="middle">members, sync state, cursors</text>

<line x1="340" y1="130" x2="340" y2="152" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<!-- ── Layer 2: SwarmDoc core ── -->
<rect x="30" y="156" width="620" height="190" rx="12" stroke-width="0.5" class="layer-teal"/>
<text class="th text-teal" x="50" y="180">SwarmDoc core  (src/lib/doc)</text>

<rect x="50" y="190" width="134" height="66" rx="6" stroke-width="0.5" class="inner-teal"/>
<text class="th text-teal" x="117" y="212" text-anchor="middle">Y.Doc</text>
<text class="ts text-sub"  x="117" y="230" text-anchor="middle">CRDT state,</text>
<text class="ts text-sub"  x="117" y="246" text-anchor="middle">update events</text>

<rect x="198" y="190" width="134" height="66" rx="6" stroke-width="0.5" class="inner-teal"/>
<text class="th text-teal" x="265" y="212" text-anchor="middle">Room</text>
<text class="ts text-sub"  x="265" y="230" text-anchor="middle">key schedule,</text>
<text class="ts text-sub"  x="265" y="246" text-anchor="middle">every feed derived</text>

<rect x="346" y="190" width="134" height="66" rx="6" stroke-width="0.5" class="inner-teal"/>
<text class="th text-teal" x="413" y="212" text-anchor="middle">Members</text>
<text class="ts text-sub"  x="413" y="230" text-anchor="middle">directory +</text>
<text class="ts text-sub"  x="413" y="246" text-anchor="middle">announce feeds</text>

<rect x="494" y="190" width="136" height="66" rx="6" stroke-width="0.5" class="inner-teal"/>
<text class="th text-teal" x="562" y="212" text-anchor="middle">DocFeed</text>
<text class="ts text-sub"  x="562" y="230" text-anchor="middle">snapshot read /</text>
<text class="ts text-sub"  x="562" y="246" text-anchor="middle">write, tail resolve</text>

<text class="ts text-sub" x="340" y="284" text-anchor="middle">debounced edit  →  full snapshot to own feed  +  signed delta  →  transport.publish()</text>
<text class="ts text-sub" x="340" y="304" text-anchor="middle">transport.subscribe()  →  handler routes join | doc | cursor | leave</text>
<text class="ts text-sub" x="340" y="324" text-anchor="middle">events: DOC_READY · MEMBERS_UPDATED · AWARENESS_UPDATED...</text>

<line x1="340" y1="346" x2="340" y2="368" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<!-- ── Layer 3: transports ── -->
<rect x="30" y="372" width="620" height="96" rx="12" stroke-width="0.5" class="layer-coral"/>
<text class="th text-coral" x="50" y="396">Transport adapters  (DocTransport interface)</text>

<rect x="50" y="406" width="280" height="52" rx="6" stroke-width="0.5" class="inner-coral"/>
<text class="th text-coral" x="190" y="428" text-anchor="middle">SwarmRtc</text>
<text class="ts text-sub"   x="190" y="446" text-anchor="middle">SDP over Swarm feeds, no server</text>

<rect x="350" y="406" width="280" height="52" rx="6" stroke-width="0.5" class="inner-coral"/>
<text class="th text-coral" x="490" y="428" text-anchor="middle">SignalingServer</text>
<text class="ts text-sub"   x="490" y="446" text-anchor="middle">y-webrtc over a WebSocket server</text>

<!-- ── Layer 4: infrastructure ── -->
<rect x="30" y="494" width="620" height="276" rx="12" stroke-width="0.5" class="layer-gray"/>
<text class="th text-gray" x="50" y="518">Infrastructure</text>

<rect x="50" y="528" width="290" height="226" rx="8" stroke-width="0.5" class="layer-blue"/>
<text class="th text-blue" x="195" y="552" text-anchor="middle">Bee node  (local or gateway)</text>
<text class="ts text-sub"  x="195" y="568" text-anchor="middle">all feeds addressed from the room key</text>

<rect x="64" y="590" width="262" height="46" rx="5" stroke-width="0.5" class="inner-blue"/>
<text class="th text-blue" x="195" y="610" text-anchor="middle">Snapshot feeds</text>
<text class="ts text-sub"  x="195" y="627" text-anchor="middle">one per session — full Y.Doc state</text>

<rect x="64" y="644" width="262" height="46" rx="5" stroke-width="0.5" class="inner-blue"/>
<text class="th text-blue" x="195" y="664" text-anchor="middle">Directory + announce feeds</text>
<text class="ts text-sub"  x="195" y="681" text-anchor="middle">identities + their sessions</text>

<rect x="64" y="698" width="262" height="46" rx="5" stroke-width="0.5" class="inner-blue"/>
<text class="th text-blue" x="195" y="718" text-anchor="middle">Signal feeds</text>
<text class="ts text-sub"  x="195" y="735" text-anchor="middle">SDP offer / answer  (SwarmRtc)</text>

<rect x="360" y="528" width="290" height="46" rx="8" stroke-width="0.5" class="inner-gray"/>
<text class="th text-gray" x="505" y="548" text-anchor="middle">y-webrtc signaling server</text>
<text class="ts text-sub"  x="505" y="565" text-anchor="middle">only with createSignalingServerTransport</text>

<rect x="360" y="586" width="290" height="46" rx="8" stroke-width="0.5" class="inner-gray"/>
<text class="th text-gray" x="505" y="606" text-anchor="middle">Swarm network</text>
<text class="ts text-sub"  x="505" y="623" text-anchor="middle">immutable, content-addressed chunks</text>

<rect x="360" y="644" width="290" height="46" rx="8" stroke-width="0.5" class="inner-gray"/>
<text class="th text-gray" x="505" y="664" text-anchor="middle">STUN / TURN</text>
<text class="ts text-sub"  x="505" y="681" text-anchor="middle">ICE candidate resolution</text>

<rect x="360" y="702" width="290" height="46" rx="8" stroke-width="0.5" class="inner-gray"/>
<text class="th text-gray" x="505" y="722" text-anchor="middle">WebRTC DataChannel  (P2P)</text>
<text class="ts text-sub"  x="505" y="739" text-anchor="middle">binary Yjs updates + JSON payloads</text>

<!-- ── Arrows ── -->
<path d="M190 458 L190 528" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M490 458 L490 528" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M430 458 L430 476 L240 476 L240 528" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M340 609 L360 609" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M620 468 L668 468 L668 725 L650 725" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M668 667 L650 667" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ── Legend ── -->
<line x1="50" y1="788" x2="80" y2="788" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts text-sub" x="88" y="792">signalling / real-time path</text>
<line x1="270" y1="788" x2="300" y2="788" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts text-sub" x="308" y="792">snapshot / persistence path</text>

</svg>
