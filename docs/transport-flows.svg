<svg width="100%" viewBox="0 0 680 800" role="img" xmlns="http://www.w3.org/2000/svg">
<title>swarm-collaborative-docs transport data flows</title>
<desc>Side-by-side flowchart comparing the SwarmRtc and signaling-server transports across peer discovery, connection setup, first sync, persistence, catch-up and cursor awareness</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
    .th  { font-size: 14px; font-weight: 500; }
    .ts  { font-size: 12px; font-weight: 400; }

    .hdr-teal   { fill: #E1F5EE; stroke: #1D9E75; }
    .hdr-purple { fill: #EEEDFE; stroke: #7F77DD; }
    .box-teal   { fill: #C2ECD9; stroke: #1D9E75; }
    .box-purple { fill: #D8D6F8; stroke: #7F77DD; }
    .box-blue   { fill: #C8DFF6; stroke: #378ADD; }
    .box-amber  { fill: #FAC775; stroke: #BA7517; }

    .text-teal   { fill: #0F6E56; }
    .text-purple { fill: #3C3489; }
    .text-blue   { fill: #0C447C; }
    .text-amber  { fill: #633806; }
    .text-sub    { fill: #5F5E5A; }
    .text-label  { fill: #888780; }

    .divider    { stroke: #C8C6BE; stroke-width: 0.5; }
    .center-div { stroke: #C8C6BE; stroke-width: 0.5; stroke-dasharray: 4 3; }
  </style>
</defs>

<!-- ── centre dividers ── -->
<line x1="340" y1="20"  x2="340" y2="450" class="center-div"/>
<line x1="340" y1="676" x2="340" y2="748" class="center-div"/>

<!-- ══ COLUMN HEADERS ══ -->
<rect x="30" y="20" width="295" height="40" rx="8" stroke-width="0.5" class="hdr-teal"/>
<text class="th text-teal" x="177" y="44" text-anchor="middle">SwarmRtc transport</text>

<rect x="355" y="20" width="295" height="40" rx="8" stroke-width="0.5" class="hdr-purple"/>
<text class="th text-purple" x="502" y="44" text-anchor="middle">Signaling server transport</text>

<!-- ══ SECTION 1: peer discovery ══ -->
<line x1="30" y1="80" x2="320" y2="80" class="divider"/>
<line x1="360" y1="80" x2="650" y2="80" class="divider"/>
<text class="ts text-label" x="340" y="77" text-anchor="middle">peer discovery</text>

<rect x="50" y="90" width="275" height="52" rx="6" stroke-width="0.5" class="box-teal"/>
<text class="th text-teal" x="188" y="112" text-anchor="middle">directory feed → announce feeds</text>
<text class="ts text-sub"  x="188" y="130" text-anchor="middle">Members.read(), re-read every 5 s</text>

<rect x="355" y="90" width="275" height="52" rx="6" stroke-width="0.5" class="box-purple"/>
<text class="th text-purple" x="493" y="112" text-anchor="middle">Y.Awareness peer event</text>
<text class="ts text-sub"    x="493" y="130" text-anchor="middle">same feeds as the durable fallback</text>

<line x1="188" y1="142" x2="188" y2="158" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<line x1="493" y1="142" x2="493" y2="158" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<!-- ══ SECTION 2: connection setup ══ -->
<line x1="30" y1="168" x2="320" y2="168" class="divider"/>
<line x1="360" y1="168" x2="650" y2="168" class="divider"/>
<text class="ts text-label" x="340" y="165" text-anchor="middle">connection setup</text>

<rect x="50" y="178" width="275" height="52" rx="6" stroke-width="0.5" class="box-teal"/>
<text class="th text-teal" x="188" y="200" text-anchor="middle">offer written to own signal feed</text>
<text class="ts text-sub"  x="188" y="218" text-anchor="middle">lower session address initiates</text>

<rect x="355" y="178" width="275" height="52" rx="6" stroke-width="0.5" class="box-purple"/>
<text class="th text-purple" x="493" y="200" text-anchor="middle">WebrtcProvider connects</text>
<text class="ts text-sub"    x="493" y="218" text-anchor="middle">SDP + ICE relayed by the WS server</text>

<line x1="188" y1="230" x2="188" y2="242" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<line x1="493" y1="230" x2="493" y2="242" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<rect x="50" y="242" width="275" height="52" rx="6" stroke-width="0.5" class="box-teal"/>
<text class="th text-teal" x="188" y="264" text-anchor="middle">answerer polls 2 s, writes answer</text>
<text class="ts text-sub"  x="188" y="282" text-anchor="middle">reads spaced — an early miss blinds it</text>

<rect x="355" y="242" width="275" height="52" rx="6" stroke-width="0.5" class="box-purple"/>
<text class="th text-purple" x="493" y="264" text-anchor="middle">y-webrtc owns reconnection</text>
<text class="ts text-sub"    x="493" y="282" text-anchor="middle">peers arrive as awareness entries</text>

<line x1="188" y1="294" x2="188" y2="306" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<rect x="50" y="306" width="275" height="52" rx="6" stroke-width="0.5" class="box-teal"/>
<text class="th text-teal" x="188" y="328" text-anchor="middle">90 s watchdog → renegotiate</text>
<text class="ts text-sub"  x="188" y="346" text-anchor="middle">retries 5 s apart, capped at 5</text>

<!-- ══ SECTION 3: first sync ══ -->
<line x1="30" y1="376" x2="320" y2="376" class="divider"/>
<line x1="360" y1="376" x2="650" y2="376" class="divider"/>
<text class="ts text-label" x="340" y="373" text-anchor="middle">first sync, on channel open</text>

<rect x="50" y="386" width="275" height="52" rx="6" stroke-width="0.5" class="box-teal"/>
<text class="th text-teal" x="188" y="408" text-anchor="middle">state vectors exchanged</text>
<text class="ts text-sub"  x="188" y="426" text-anchor="middle">each side replies with the diff only</text>

<rect x="355" y="386" width="275" height="52" rx="6" stroke-width="0.5" class="box-purple"/>
<text class="th text-purple" x="493" y="408" text-anchor="middle">Yjs sync protocol</text>
<text class="ts text-sub"    x="493" y="426" text-anchor="middle">run inside the provider</text>

<!-- ══ SECTION 4: local edit → persistence ══ -->
<line x1="30" y1="456" x2="650" y2="456" class="divider"/>
<text class="ts text-label" x="340" y="453" text-anchor="middle">local edit → persistence  (both transports)</text>

<rect x="50" y="466" width="580" height="52" rx="6" stroke-width="0.5" class="box-blue"/>
<text class="th text-blue" x="340" y="488" text-anchor="middle">500 ms debounce → publishSnapshot()</text>
<text class="ts text-sub"  x="340" y="506" text-anchor="middle">full Y.Doc state to this session's feed, signed delta broadcast to open channels</text>

<line x1="340" y1="518" x2="340" y2="530" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<rect x="50" y="530" width="580" height="52" rx="6" stroke-width="0.5" class="box-blue"/>
<text class="th text-blue" x="340" y="552" text-anchor="middle">receiver verifies the signature, then applies the delta</text>
<text class="ts text-sub"  x="340" y="570" text-anchor="middle">a feed-index gap means fetching that peer's snapshot instead</text>

<!-- ══ SECTION 5: catching up ══ -->
<line x1="30" y1="600" x2="650" y2="600" class="divider"/>
<text class="ts text-label" x="340" y="597" text-anchor="middle">catching up  (both transports)</text>

<rect x="50" y="610" width="580" height="52" rx="6" stroke-width="0.5" class="box-blue"/>
<text class="th text-blue" x="340" y="632" text-anchor="middle">15 s snapshot poll for every peer without a channel</text>
<text class="ts text-sub"  x="340" y="650" text-anchor="middle">a channel opening triggers an immediate re-read · DOC_SYNC_STATE gates the editor</text>

<!-- ══ SECTION 6: cursors ══ -->
<line x1="30" y1="680" x2="320" y2="680" class="divider"/>
<line x1="360" y1="680" x2="650" y2="680" class="divider"/>
<text class="ts text-label" x="340" y="677" text-anchor="middle">cursors &amp; presence</text>

<rect x="50" y="690" width="275" height="52" rx="6" stroke-width="0.5" class="box-amber"/>
<text class="th text-amber" x="188" y="712" text-anchor="middle">CursorPayload as a JSON frame</text>
<text class="ts text-sub"   x="188" y="730" text-anchor="middle">on the same DataChannel</text>

<rect x="355" y="690" width="275" height="52" rx="6" stroke-width="0.5" class="box-amber"/>
<text class="th text-amber" x="493" y="712" text-anchor="middle">cursor → Y.Awareness field</text>
<text class="ts text-sub"   x="493" y="730" text-anchor="middle">bridged back as CursorPayload</text>

<line x1="188" y1="742" x2="188" y2="758" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<line x1="493" y1="742" x2="493" y2="758" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<text class="ts text-sub" x="340" y="778" text-anchor="middle">DOC_EVENTS.AWARENESS_UPDATED → UI — a caret is dropped once its owner is no longer live and connected</text>

</svg>
