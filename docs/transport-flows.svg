<svg width="100%" viewBox="0 0 680 800" role="img" xmlns="http://www.w3.org/2000/svg">
<title>swarm-collaborative-docs transport flows</title>
<desc>Side-by-side flowchart comparing y-webrtc and swarm-rtc transports across peer discovery, connection setup, doc sync, snapshot persistence, and cursor awareness</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
    .th  { font-size: 14px; font-weight: 500; }
    .ts  { font-size: 12px; font-weight: 400; }

    .hdr-purple { fill: #EEEDFE; stroke: #7F77DD; }
    .hdr-teal   { fill: #E1F5EE; stroke: #1D9E75; }
    .box-purple { fill: #D8D6F8; stroke: #7F77DD; }
    .box-teal   { fill: #C2ECD9; stroke: #1D9E75; }
    .box-blue   { fill: #C8DFF6; stroke: #378ADD; }
    .box-amber  { fill: #FAC775; stroke: #BA7517; }

    .text-purple { fill: #3C3489; }
    .text-teal   { fill: #0F6E56; }
    .text-blue   { fill: #0C447C; }
    .text-amber  { fill: #633806; }
    .text-sub    { fill: #5F5E5A; }
    .text-label  { fill: #888780; }

    .divider     { stroke: #C8C6BE; stroke-width: 0.5; }
    .center-div  { stroke: #C8C6BE; stroke-width: 0.5; stroke-dasharray: 4 3; }
  </style>
</defs>

<!-- ── centre divider ── -->
<line x1="340" y1="20" x2="340" y2="780" class="center-div"/>

<!-- ══ COLUMN HEADERS ══ -->
<rect x="30"  y="20" width="295" height="40" rx="8" stroke-width="0.5" class="hdr-purple"/>
<text class="th text-purple" x="178" y="44" text-anchor="middle">y-webrtc transport</text>

<rect x="355" y="20" width="295" height="40" rx="8" stroke-width="0.5" class="hdr-teal"/>
<text class="th text-teal"   x="503" y="44" text-anchor="middle">swarm-rtc transport</text>


<!-- ══ SECTION 1: peer discovery ══ -->
<line x1="30"  y1="80" x2="320" y2="80" class="divider"/>
<line x1="360" y1="80" x2="650" y2="80" class="divider"/>
<text class="ts text-label" x="340" y="77" text-anchor="middle">peer discovery</text>

<rect x="50"  y="90" width="275" height="52" rx="6" stroke-width="0.5" class="box-purple"/>
<text class="th text-purple" x="188" y="112" text-anchor="middle">Y.Awareness change event</text>
<text class="ts text-sub"    x="188" y="130" text-anchor="middle">new clientId → onPeerDiscovered()</text>

<rect x="355" y="90" width="275" height="52" rx="6" stroke-width="0.5" class="box-teal"/>
<text class="th text-teal" x="493" y="112" text-anchor="middle">members feed on Swarm</text>
<text class="ts text-sub"  x="493" y="130" text-anchor="middle">Members.add(), manual refresh</text>

<line x1="188" y1="142" x2="188" y2="164" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<line x1="493" y1="142" x2="493" y2="164" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>


<!-- ══ SECTION 2: connection setup ══ -->
<line x1="30"  y1="182" x2="320" y2="182" class="divider"/>
<line x1="360" y1="182" x2="650" y2="182" class="divider"/>
<text class="ts text-label" x="340" y="179" text-anchor="middle">connection setup</text>

<rect x="50"  y="192" width="275" height="52" rx="6" stroke-width="0.5" class="box-purple"/>
<text class="th text-purple" x="188" y="214" text-anchor="middle">WebrtcProvider auto-connects</text>
<text class="ts text-sub"    x="188" y="232" text-anchor="middle">via external WS signaling server</text>

<rect x="355" y="192" width="275" height="52" rx="6" stroke-width="0.5" class="box-teal"/>
<text class="th text-teal" x="493" y="214" text-anchor="middle">SDP offer written to Swarm feed</text>
<text class="ts text-sub"  x="493" y="232" text-anchor="middle">lower address = initiator</text>

<line x1="493" y1="244" x2="493" y2="266" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<rect x="355" y="266" width="275" height="52" rx="6" stroke-width="0.5" class="box-teal"/>
<text class="th text-teal" x="493" y="288" text-anchor="middle">answerer polls signal feed</text>
<text class="ts text-sub"  x="493" y="306" text-anchor="middle">SDP answer written back</text>

<line x1="493" y1="318" x2="493" y2="340" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>


<!-- ══ SECTION 3: doc sync ══ -->
<line x1="30"  y1="358" x2="320" y2="358" class="divider"/>
<line x1="360" y1="358" x2="650" y2="358" class="divider"/>
<text class="ts text-label" x="340" y="355" text-anchor="middle">doc sync</text>

<rect x="50"  y="368" width="275" height="52" rx="6" stroke-width="0.5" class="box-purple"/>
<text class="th text-purple" x="188" y="390" text-anchor="middle">y-webrtc owns Y.Doc sync</text>
<text class="ts text-sub"    x="188" y="408" text-anchor="middle">DataChannels managed by library</text>

<rect x="355" y="340" width="275" height="52" rx="6" stroke-width="0.5" class="box-teal"/>
<text class="th text-teal" x="493" y="362" text-anchor="middle">DataChannel opens</text>
<text class="ts text-sub"  x="493" y="380" text-anchor="middle">full state snapshot sent to peer</text>

<line x1="493" y1="392" x2="493" y2="414" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<rect x="355" y="414" width="275" height="52" rx="6" stroke-width="0.5" class="box-teal"/>
<text class="th text-teal" x="493" y="436" text-anchor="middle">Y.Doc 'update' listener</text>
<text class="ts text-sub"  x="493" y="454" text-anchor="middle">binary update → channel.send()</text>

<line x1="188" y1="420" x2="188" y2="448" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<line x1="493" y1="466" x2="493" y2="488" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>


<!-- ══ SECTION 4: snapshot persistence ══ -->
<line x1="30"  y1="506" x2="650" y2="506" class="divider"/>
<text class="ts text-label" x="340" y="503" text-anchor="middle">snapshot persistence  (both transports)</text>

<rect x="50"  y="516" width="275" height="52" rx="6" stroke-width="0.5" class="box-blue"/>
<text class="th text-blue" x="188" y="538" text-anchor="middle">debounce → publishSnapshot()</text>
<text class="ts text-sub"  x="188" y="556" text-anchor="middle">writeDoc() to own Swarm feed</text>

<rect x="355" y="516" width="275" height="52" rx="6" stroke-width="0.5" class="box-blue"/>
<text class="th text-blue" x="493" y="538" text-anchor="middle">DocPayload published (delta + sig)</text>
<text class="ts text-sub"  x="493" y="556" text-anchor="middle">peers call fetchLatestFromMember()</text>

<line x1="188" y1="568" x2="188" y2="590" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<line x1="493" y1="568" x2="493" y2="590" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>


<!-- ══ SECTION 5: cursor awareness ══ -->
<line x1="30"  y1="608" x2="320" y2="608" class="divider"/>
<line x1="360" y1="608" x2="650" y2="608" class="divider"/>
<text class="ts text-label" x="340" y="605" text-anchor="middle">cursor awareness</text>

<rect x="50"  y="618" width="275" height="52" rx="6" stroke-width="0.5" class="box-amber"/>
<text class="th text-amber" x="188" y="640" text-anchor="middle">publish(CursorPayload)</text>
<text class="ts text-sub"   x="188" y="658" text-anchor="middle">→ awareness.setLocalStateField()</text>

<rect x="355" y="618" width="275" height="52" rx="6" stroke-width="0.5" class="box-amber"/>
<text class="th text-amber" x="493" y="640" text-anchor="middle">publish(CursorPayload)</text>
<text class="ts text-sub"   x="493" y="658" text-anchor="middle">→ channel.send() as JSON string</text>

<line x1="188" y1="670" x2="188" y2="692" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<line x1="493" y1="670" x2="493" y2="692" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<rect x="50"  y="692" width="275" height="52" rx="6" stroke-width="0.5" class="box-amber"/>
<text class="th text-amber" x="188" y="714" text-anchor="middle">awareness 'change' event</text>
<text class="ts text-sub"   x="188" y="732" text-anchor="middle">→ handler(CursorPayload)</text>

<rect x="355" y="692" width="275" height="52" rx="6" stroke-width="0.5" class="box-amber"/>
<text class="th text-amber" x="493" y="714" text-anchor="middle">DataChannel 'message' (string)</text>
<text class="ts text-sub"   x="493" y="732" text-anchor="middle">→ handler(CursorPayload)</text>

<line x1="188" y1="744" x2="188" y2="766" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<line x1="493" y1="744" x2="493" y2="766" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<rect x="50"  y="766" width="275" height="14" rx="4" stroke-width="0" fill="none"/>
<text class="ts text-sub" x="188" y="778" text-anchor="middle">DOC_EVENTS.AWARENESS_UPDATED → UI</text>

<rect x="355" y="766" width="275" height="14" rx="4" stroke-width="0" fill="none"/>
<text class="ts text-sub" x="493" y="778" text-anchor="middle">DOC_EVENTS.AWARENESS_UPDATED → UI</text>

</svg>
