<svg width="100%" viewBox="0 0 520 680" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SwarmRtc transport — infrastructure diagram</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
    .th  { font-size: 14px; font-weight: 500; }
    .ts  { font-size: 12px; }
    .sub { fill: #5F5E5A; }
    .lbl { font-size: 11px; fill: #888780; }
    .layer-teal  { fill: #E1F5EE; stroke: #1D9E75; stroke-width: 0.5; }
    .inner-teal  { fill: #C2ECD9; stroke: #1D9E75; stroke-width: 0.5; }
    .layer-blue  { fill: #E6F1FB; stroke: #378ADD; stroke-width: 0.5; }
    .inner-blue  { fill: #C8DFF6; stroke: #378ADD; stroke-width: 0.5; }
    .layer-gray  { fill: #F1EFE8; stroke: #888780; stroke-width: 0.5; }
    .inner-gray  { fill: #E0DDD5; stroke: #888780; stroke-width: 0.5; }
    .layer-coral { fill: #FAECE7; stroke: #D85A30; stroke-width: 0.5; }
    .text-teal   { fill: #0F6E56; }
    .text-blue   { fill: #0C447C; }
    .text-gray   { fill: #444441; }
    .text-coral  { fill: #993C1D; }
  </style>
</defs>

<!-- Title -->
<rect x="20" y="16" width="480" height="36" rx="8" class="layer-coral"/>
<text class="th text-coral" x="260" y="38" text-anchor="middle">SwarmRtc Transport</text>

<!-- Peer A -->
<rect x="20" y="68" width="220" height="120" rx="10" class="layer-teal"/>
<text class="th text-teal" x="130" y="90" text-anchor="middle">Peer A (browser)</text>
<rect x="36" y="100" width="188" height="36" rx="6" class="inner-teal"/>
<text class="th text-teal" x="130" y="118" text-anchor="middle">SwarmDoc + SwarmSignal</text>
<text class="ts sub" x="130" y="134" text-anchor="middle">signs SDP, reads/writes feed</text>
<rect x="36" y="144" width="188" height="36" rx="6" class="inner-teal"/>
<text class="th text-teal" x="130" y="162" text-anchor="middle">RTCPeerConnection</text>
<text class="ts sub" x="130" y="178" text-anchor="middle">initiator (lower address)</text>

<!-- Peer B -->
<rect x="280" y="68" width="220" height="120" rx="10" class="layer-teal"/>
<text class="th text-teal" x="390" y="90" text-anchor="middle">Peer B (browser)</text>
<rect x="296" y="100" width="188" height="36" rx="6" class="inner-teal"/>
<text class="th text-teal" x="390" y="118" text-anchor="middle">SwarmDoc + SwarmSignal</text>
<text class="ts sub" x="390" y="134" text-anchor="middle">signs SDP, reads/writes feed</text>
<rect x="296" y="144" width="188" height="36" rx="6" class="inner-teal"/>
<text class="th text-teal" x="390" y="162" text-anchor="middle">RTCPeerConnection</text>
<text class="ts sub" x="390" y="178" text-anchor="middle">answerer</text>

<!-- Bee node -->
<rect x="100" y="240" width="320" height="180" rx="10" class="layer-blue"/>
<text class="th text-blue" x="260" y="262" text-anchor="middle">Bee node  (local or gateway)</text>
<rect x="116" y="274" width="130" height="56" rx="6" class="inner-blue"/>
<text class="th text-blue" x="181" y="296" text-anchor="middle">Swarm feeds</text>
<text class="ts sub" x="181" y="312" text-anchor="middle">signal + snapshot</text>
<rect x="274" y="274" width="130" height="56" rx="6" class="inner-blue"/>
<text class="th text-blue" x="339" y="296" text-anchor="middle">Member feed</text>
<text class="ts sub" x="339" y="312" text-anchor="middle">peer discovery</text>
<rect x="116" y="344" width="288" height="36" rx="6" class="inner-blue"/>
<text class="th text-blue" x="260" y="362" text-anchor="middle">Swarm network</text>
<text class="ts sub" x="260" y="378" text-anchor="middle">immutable chunk storage</text>

<!-- STUN server -->
<rect x="100" y="440" width="320" height="56" rx="10" class="layer-gray"/>
<text class="th text-gray" x="260" y="464" text-anchor="middle">STUN server</text>
<text class="ts sub" x="260" y="482" text-anchor="middle">ICE candidate resolution  (public, e.g. Google STUN)</text>

<!-- WebRTC DataChannel -->
<rect x="100" y="516" width="320" height="56" rx="10" class="layer-gray"/>
<text class="th text-gray" x="260" y="540" text-anchor="middle">WebRTC DataChannel  (P2P)</text>
<text class="ts sub" x="260" y="558" text-anchor="middle">binary Yjs updates + JSON cursor/notifications</text>

<!-- Arrows: Peer A → Bee -->
<path d="M130 188 L130 220 L200 220 L200 240" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<text class="lbl" x="150" y="216">SDP offer/answer</text>
<!-- Arrows: Peer B → Bee -->
<path d="M390 188 L390 220 L320 220 L320 240" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<!-- Arrows: Bee → STUN -->
<path d="M260 420 L260 440" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="lbl" x="268" y="435">ICE</text>
<!-- Arrows: P2P DataChannel -->
<path d="M240 188 L240 540 L100 540" fill="none" stroke="#1D9E75" stroke-width="1.2" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
<path d="M280 188 L280 540 L420 540" fill="none" stroke="#1D9E75" stroke-width="1.2" stroke-dasharray="6 3" marker-end="url(#arrow)"/>

<!-- Legend -->
<line x1="26" y1="604" x2="56" y2="604" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<text class="lbl" x="64" y="608">Swarm feed read/write</text>
<line x1="26" y1="626" x2="56" y2="626" stroke="#1D9E75" stroke-width="1.2" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
<text class="lbl" x="64" y="630">P2P data channel (post-handshake)</text>
<line x1="26" y1="648" x2="56" y2="648" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="lbl" x="64" y="652">ICE / indirect</text>
</svg>
