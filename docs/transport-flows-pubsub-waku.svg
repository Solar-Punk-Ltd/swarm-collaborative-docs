<svg width="100%" viewBox="0 0 680 760" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Transport data flows — SwarmPubSub vs Waku</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
    .th  { font-size: 14px; font-weight: 500; }
    .ts  { font-size: 12px; font-weight: 400; }
    .hdr-amber  { fill: #FEF3DC; stroke: #BA7517; stroke-width: 0.5; }
    .hdr-gray   { fill: #F1EFE8; stroke: #888780; stroke-width: 0.5; }
    .box-amber  { fill: #FAC775; stroke: #BA7517; stroke-width: 0.5; }
    .box-gray   { fill: #E0DDD5; stroke: #888780; stroke-width: 0.5; }
    .box-blue   { fill: #C8DFF6; stroke: #378ADD; stroke-width: 0.5; }
    .text-amber { fill: #633806; }
    .text-gray  { fill: #444441; }
    .text-blue  { fill: #0C447C; }
    .text-sub   { fill: #5F5E5A; }
    .text-label { fill: #888780; }
    .divider    { stroke: #C8C6BE; stroke-width: 0.5; }
    .center-div { stroke: #C8C6BE; stroke-width: 0.5; stroke-dasharray: 4 3; }
  </style>
</defs>

<!-- Centre divider -->
<line x1="340" y1="20" x2="340" y2="740" class="center-div"/>

<!-- Column headers -->
<rect x="30"  y="20" width="295" height="40" rx="8" class="hdr-amber"/>
<text class="th text-amber" x="178" y="44" text-anchor="middle">SwarmPubSub  ⚠️ experimental</text>
<rect x="355" y="20" width="295" height="40" rx="8" class="hdr-gray"/>
<text class="th text-gray"  x="503" y="44" text-anchor="middle">Waku  ⚠️ experimental</text>

<!-- ── SECTION: peer discovery ── -->
<line x1="30"  y1="80" x2="320" y2="80" class="divider"/>
<line x1="360" y1="80" x2="650" y2="80" class="divider"/>
<text class="ts text-label" x="340" y="77" text-anchor="middle">peer discovery</text>

<rect x="50"  y="90" width="275" height="52" rx="6" class="box-amber"/>
<text class="th text-amber" x="188" y="112" text-anchor="middle">Swarm member feed</text>
<text class="ts text-sub"   x="188" y="130" text-anchor="middle">shared consensus feed, polling</text>

<rect x="355" y="90" width="275" height="52" rx="6" class="box-gray"/>
<text class="th text-gray" x="493" y="112" text-anchor="middle">Swarm member feed</text>
<text class="ts text-sub"  x="493" y="130" text-anchor="middle">shared consensus feed, polling</text>

<line x1="188" y1="142" x2="188" y2="164" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<line x1="493" y1="142" x2="493" y2="164" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<!-- ── SECTION: connection setup ── -->
<line x1="30"  y1="182" x2="320" y2="182" class="divider"/>
<line x1="360" y1="182" x2="650" y2="182" class="divider"/>
<text class="ts text-label" x="340" y="179" text-anchor="middle">connection setup</text>

<rect x="50"  y="192" width="275" height="52" rx="6" class="box-amber"/>
<text class="th text-amber" x="188" y="214" text-anchor="middle">WebSocket to broker Bee node</text>
<text class="ts text-sub"   x="188" y="232" text-anchor="middle">GSOC topic derived from docFeedId</text>

<rect x="355" y="192" width="275" height="52" rx="6" class="box-gray"/>
<text class="th text-gray" x="493" y="214" text-anchor="middle">Waku light node bootstraps</text>
<text class="ts text-sub"  x="493" y="232" text-anchor="middle">connects to libp2p network peers</text>

<line x1="188" y1="244" x2="188" y2="266" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<line x1="493" y1="244" x2="493" y2="266" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<rect x="50"  y="266" width="275" height="52" rx="6" class="box-amber"/>
<text class="th text-amber" x="188" y="288" text-anchor="middle">all peers on same GSOC address</text>
<text class="ts text-sub"   x="188" y="306" text-anchor="middle">ready to send and receive</text>

<rect x="355" y="266" width="275" height="52" rx="6" class="box-gray"/>
<text class="th text-gray" x="493" y="288" text-anchor="middle">Filter subscription confirmed</text>
<text class="ts text-sub"  x="493" y="306" text-anchor="middle">buffered publishes drained</text>

<line x1="188" y1="318" x2="188" y2="340" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<line x1="493" y1="318" x2="493" y2="340" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<!-- ── SECTION: doc sync ── -->
<line x1="30"  y1="358" x2="320" y2="358" class="divider"/>
<line x1="360" y1="358" x2="650" y2="358" class="divider"/>
<text class="ts text-label" x="340" y="355" text-anchor="middle">doc sync</text>

<rect x="50"  y="368" width="275" height="52" rx="6" class="box-amber"/>
<text class="th text-amber" x="188" y="390" text-anchor="middle">DocPayload published (delta + sig)</text>
<text class="ts text-sub"   x="188" y="408" text-anchor="middle">JSON over GSOC WebSocket</text>

<rect x="355" y="368" width="275" height="52" rx="6" class="box-gray"/>
<text class="th text-gray" x="493" y="390" text-anchor="middle">DocPayload published (delta + sig)</text>
<text class="ts text-sub"  x="493" y="408" text-anchor="middle">JSON via LightPush → gossipsub</text>

<line x1="188" y1="420" x2="188" y2="442" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<line x1="493" y1="420" x2="493" y2="442" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<!-- ── SECTION: snapshot persistence ── -->
<line x1="30"  y1="460" x2="650" y2="460" class="divider"/>
<text class="ts text-label" x="340" y="457" text-anchor="middle">snapshot persistence  (both transports)</text>

<rect x="50"  y="470" width="275" height="52" rx="6" class="box-blue"/>
<text class="th text-blue" x="188" y="492" text-anchor="middle">debounce → publishSnapshot()</text>
<text class="ts text-sub"  x="188" y="510" text-anchor="middle">writeDoc() to own Swarm feed</text>

<rect x="355" y="470" width="275" height="52" rx="6" class="box-blue"/>
<text class="th text-blue" x="493" y="492" text-anchor="middle">debounce → publishSnapshot()</text>
<text class="ts text-sub"  x="493" y="510" text-anchor="middle">writeDoc() to own Swarm feed</text>

<line x1="188" y1="522" x2="188" y2="544" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<line x1="493" y1="522" x2="493" y2="544" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<!-- ── SECTION: cursor awareness ── -->
<line x1="30"  y1="562" x2="320" y2="562" class="divider"/>
<line x1="360" y1="562" x2="650" y2="562" class="divider"/>
<text class="ts text-label" x="340" y="559" text-anchor="middle">cursor awareness</text>

<rect x="50"  y="572" width="275" height="52" rx="6" class="box-amber"/>
<text class="th text-amber" x="188" y="594" text-anchor="middle">publish(CursorPayload)</text>
<text class="ts text-sub"   x="188" y="612" text-anchor="middle">JSON over GSOC WebSocket</text>

<rect x="355" y="572" width="275" height="52" rx="6" class="box-gray"/>
<text class="th text-gray" x="493" y="594" text-anchor="middle">publish(CursorPayload)</text>
<text class="ts text-sub"  x="493" y="612" text-anchor="middle">JSON via LightPush → gossipsub</text>

<line x1="188" y1="624" x2="188" y2="646" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<line x1="493" y1="624" x2="493" y2="646" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<rect x="50"  y="646" width="275" height="52" rx="6" class="box-amber"/>
<text class="th text-amber" x="188" y="668" text-anchor="middle">GSOC onMessage callback</text>
<text class="ts text-sub"   x="188" y="686" text-anchor="middle">→ handler(CursorPayload)</text>

<rect x="355" y="646" width="275" height="52" rx="6" class="box-gray"/>
<text class="th text-gray" x="493" y="668" text-anchor="middle">Filter protocol callback</text>
<text class="ts text-sub"  x="493" y="686" text-anchor="middle">→ handler(CursorPayload)</text>

<line x1="188" y1="698" x2="188" y2="720" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<line x1="493" y1="698" x2="493" y2="720" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<text class="ts text-sub" x="188" y="732" text-anchor="middle">DOC_EVENTS.AWARENESS_UPDATED → UI</text>
<text class="ts text-sub" x="493" y="732" text-anchor="middle">DOC_EVENTS.AWARENESS_UPDATED → UI</text>
</svg>
